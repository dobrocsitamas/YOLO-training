# Adathalmaz konfiguráció – 13 osztályos struktúra
# Ez a fájl a dataset/data.yaml referencia-másolata.
# A tényleges tréninghez használd a prepare_dataset.py által generált dataset/data.yaml-t.

path: D:/YOLO training/dataset   # gyökérmappa (prepare_dataset.py kimenete)

train: images/train
val: images/val

# Osztályok (14 db)
nc: 14
names:
  0: person              # gyalogos
  1: bicycle             # kerékpár
  2: motorcycle          # motorkerékpár, robogó
  3: personal_car        # személyautó (COCO: car)
  4: light_truck         # kisteherautó, furgon, dobozos (< 3.5t, áruszállítás)
  5: medium_truck        # közepes teherjármű (3.5–12t)
  6: heavy_truck         # nehéz teherjármű (> 12t, merev)
  7: vehicle_combination # nyerges vontatós / pótkocsis szerelvény
  8: bus_solo            # szóló autóbusz (nagybusz, >20 férőhely)
  9: bus_articulated     # csuklós autóbusz
  10: trolley_solo       # szóló trolibusz
  11: trolley_articulated # csuklós trolibusz
  12: tram               # villamos
  13: minibus            # mikrobusz / kisbusz (9–20 fős, pl. Sprinter, Transit Bus)
